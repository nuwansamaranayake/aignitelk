# HTML pages must be revalidated on every visit, so a deploy shows up without a
# hard refresh. Hashed assets under /_next/static/ stay cached for a year (below).
map $sent_http_content_type $html_cache_control {
    default       "";
    ~^text/html   "no-cache";
}

server {
    listen 80;
    server_name aignitelk.com www.aignitelk.com;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS, so nginx sees plain http on port 80. Relative
    # Location headers keep redirects on https and on the public host.
    absolute_redirect off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache static assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # WebVTT captions for product videos. The default mime.types has no vtt entry, and
    # browsers drop caption tracks not served as text/vtt.
    location ~* \.vtt$ {
        types { text/vtt vtt; }
        charset utf-8;
        try_files $uri =404;
    }

    # Static export: every real route has its own .html file, so unknown paths
    # get a real 404 instead of the homepage (the old /index.html fallback).
    error_page 404 /404.html;

    # The static export writes /route.html (next.config.mjs has no trailingSlash),
    # so /route/ used to 404. When route.html exists, send the trailing-slash URL
    # to the canonical one. Folders and unknown paths keep their old answer, and
    # "/" does not match this pattern.
    location ~ ^(?<slashless>.+)/$ {
        if (-f $document_root$slashless.html) {
            return 301 $slashless$is_args$args;
        }
    }

    location / {
        add_header Cache-Control $html_cache_control;
        try_files $uri $uri.html $uri/ =404;
    }
}
