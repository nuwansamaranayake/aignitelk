server {
    listen 80;
    server_name aignitelk.com www.aignitelk.com;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache static assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # WebVTT captions for product videos. The default mime.types has no vtt entry, and
    # browsers drop caption tracks not served as text/vtt.
    location ~* \.vtt$ {
        types { text/vtt vtt; }
        charset utf-8;
        try_files $uri =404;
    }

    # Static export: every real route has its own .html file, so unknown paths
    # get a real 404 instead of the homepage (the old /index.html fallback).
    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
